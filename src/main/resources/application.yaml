server:
  port: 8080

auth:
  security:
    enabled: true
    jwt-access-secret: "YOUR_SECURE_BASE64_OR_HS512_SECRET_KEY_MIN_512_BITS_LONG_ACCESS"
    jwt-refresh-secret: "YOUR_SECURE_BASE64_OR_HS512_SECRET_KEY_MIN_512_BITS_LONG_REFRESH"
    jwt-access-expiration: 86400000       # 24 Hours in milliseconds
    jwt-refresh-expiration: 604800000     # 7 Days in milliseconds

    # Whitelist custom endpoints that should bypass authentication
    public-endpoints:
      - "/hello"
      - "/api/v1/public/**"

    # Unauthenticated standard endpoint
    api:
      login: "/api/v1/auth/login"
      register: "/api/v1/auth/register"
      refresh: "/api/v1/auth/refresh"

    cors:
      allowed-origins:
        - "*"
      allowed-methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "OPTIONS"
      allowed-headers:
        - "*"